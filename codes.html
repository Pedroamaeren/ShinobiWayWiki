<body>

<main>

    <img src="assets/categories/codesdes.png" alt="Codes" class="intro-image">


    <div class="fire-header">
        <h1 class="fire-title">🎟️ CODES</h1>
    </div>


    <div class="fire-box">

            <p class="codes-notice">
